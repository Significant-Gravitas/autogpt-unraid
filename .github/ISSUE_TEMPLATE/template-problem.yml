name: Unraid template problem
description: Report an installation, update, or configuration problem specific to the AutoGPT Unraid template.
title: "[Unraid]: "
labels:
  - unraid
body:
  - type: markdown
    attributes:
      value: |
        Remove secrets, email addresses, tokens, and other personal data from logs before submitting.
  - type: input
    id: unraid-version
    attributes:
      label: Unraid version
      placeholder: 7.x.x
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: AutoGPT image tag or digest
      placeholder: significantgravitas/autogpt:latest
    validations:
      required: true
  - type: dropdown
    id: health
    attributes:
      label: Docker health state
      options:
        - healthy
        - starting
        - unhealthy
        - no health state
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected behavior, actual behavior, and whether this is a fresh appdata path.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Paste only the relevant excerpt after removing secrets and personal data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, email addresses, and other personal data.
          required: true
