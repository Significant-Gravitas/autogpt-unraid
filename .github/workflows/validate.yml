name: Validate Unraid template

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install XML tools
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
      - name: Validate template
        run: scripts/validate.sh
      - name: Check shell syntax
        run: bash -n scripts/validate.sh
      - name: Lint shell
        run: shellcheck scripts/validate.sh
      - name: Check repository whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git show --check --format= HEAD
          fi
