[program:local-model-adapter]
command=/usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME=/nonexistent PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 LISTEN_HOST=127.0.0.1 LISTEN_PORT=8098 EMBED_PAD_DIM=1536 EMBED_MAX_TOKENS=2048 CHAT_UPSTREAM=%(ENV_CHAT_UPSTREAM)s EMBED_UPSTREAM=%(ENV_EMBED_UPSTREAM)s CHAT_FAST_STANDARD_MODEL=%(ENV_CHAT_FAST_STANDARD_MODEL)s GRAPHITI_LLM_MODEL=%(ENV_GRAPHITI_LLM_MODEL)s GRAPHITI_RERANKER_MODEL=%(ENV_GRAPHITI_RERANKER_MODEL)s CHAT_USE_LOCAL=%(ENV_CHAT_USE_LOCAL)s CHAT_BASE_URL=%(ENV_CHAT_BASE_URL)s CHAT_API_KEY=%(ENV_CHAT_API_KEY)s GRAPHITI_LLM_BASE_URL=%(ENV_GRAPHITI_LLM_BASE_URL)s GRAPHITI_LLM_API_KEY=%(ENV_GRAPHITI_LLM_API_KEY)s GRAPHITI_EMBEDDER_BASE_URL=%(ENV_GRAPHITI_EMBEDDER_BASE_URL)s GRAPHITI_EMBEDDER_API_KEY=%(ENV_GRAPHITI_EMBEDDER_API_KEY)s GRAPHITI_EMBEDDER_MODEL=%(ENV_GRAPHITI_EMBEDDER_MODEL)s STORE_EMBEDDING_MODEL=%(ENV_STORE_EMBEDDING_MODEL)s /usr/bin/setpriv --no-new-privs -- /usr/bin/python3 -I -u /opt/autogpt-local/run_adapter.py
directory=/opt/autogpt-local
user=autogpt-local-adapter
priority=30
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=1
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
